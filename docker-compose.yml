# All services for the VPS. Start everything:   docker compose up -d --build
# Just the databases (local dev on Windows):     docker compose up -d postgres redis
#
# Secrets come from the .env file next to this file (never committed).
# Database ports are bound to 127.0.0.1 only — NOT reachable from the internet.

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    # 4 GB VPS (Oct 17): explicit memory settings. Command-line -c flags take precedence over the
    # postgresql.conf that timescaledb-tune wrote at first init, so the two never fight.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=1GB
      - -c
      - timescaledb.max_background_workers=4
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=2
    shm_size: 256m
    mem_limit: 1500m
    mem_reservation: 512m
    oom_score_adj: -500
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-solbot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-solbot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # appendonly = survive restarts (BullMQ delayed jobs live here).
    # noeviction is required by BullMQ — it must never silently drop jobs.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "2gb", "--maxmemory-policy", "noeviction", "--lazyfree-lazy-eviction", "yes", "--lazyfree-lazy-expire", "yes"]
    # No hard cap: Redis's own --maxmemory governs; an AOF rewrite forks and briefly doubles RSS.
    mem_reservation: 768m
    oom_score_adj: -500
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build:
      context: .
      args:
        # Shown on the dashboard so a stuck update is obvious (set by scripts/auto-update.sh).
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    env_file: .env
    volumes:
      # Obsidian vault notes (OBSIDIAN_VAULT_PATH=/vault in .env) land in /root/bot/obsidian on the host.
      - ./obsidian:/vault
    environment:
      # Inside Docker the services talk by name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solbot}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      # 4 GB VPS: V8 heap 1.5 GB (the box used to swap at the default ~2 GB on 2 GB RAM); bigger young
      # generation = fewer scavenges for the trade-stream churn.
      NODE_OPTIONS: --max-old-space-size=1536 --max-semi-space-size=32
    mem_limit: 2g
    mem_reservation: 768m
    # If the kernel must kill something, the bot goes first (it restarts in seconds; the databases don't).
    oom_score_adj: 300
    ports:
      - "127.0.0.1:8080:8080" # API — only reachable via Caddy (HTTPS) from outside
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Docker marks the bot unhealthy if the API stops answering (shows in `docker compose ps`).
    # node:22-slim has no curl, so use node's own fetch.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # The bot's own graceful shutdown waits up to 15s; give it 20 before SIGKILL.
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # v15.4: forex in its own container (same image, its own process), so a crypto push never restarts forex and a
  # forex push never restarts the crypto bot (scripts/auto-update.sh restarts only what a push touched).
  forex:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    env_file: .env
    # no `prisma db push` here: the crypto bot owns the schema
    command: ["node", "dist/forex-main.js"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solbot}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      FOREX_PORT: "8081"
      # the hourly lab + the 15m / 1m test peak at a few hundred MB
      NODE_OPTIONS: --max-old-space-size=1024
    mem_limit: 1400m
    mem_reservation: 384m
    oom_score_adj: 200
    ports:
      - "127.0.0.1:8081:8081" # forex API — only reachable via Caddy (HTTPS) from outside
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/api/forex/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # HTTPS reverse proxy for the dashboard API (VPS only — set API_DOMAIN in .env).
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - bot
    mem_limit: 128m
    mem_reservation: 32m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Phase 8 — uncomment once ml/ has a real service.
  # ml-service:
  #   build: ./ml
  #   restart: unless-stopped
  #   env_file: .env
  #   ports:
  #     - "127.0.0.1:8000:8000"
  #   depends_on: [postgres]

volumes:
  pgdata:
  redisdata:
  caddydata:
