# Builds the dashboard and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# To deploy straight from the bot's working branch (no merging needed):
#   Settings → Environments → github-pages → Deployment branches → add
#   claude/festive-albattani-6aufe6
# Optional: Settings → Secrets and variables → Actions → Variables →
#   VITE_API_URL = https://<your-ip-with-dashes>.sslip.io   (pre-fills the login screen)
name: Deploy dashboard

on:
  push:
    branches: [main, claude/festive-albattani-6aufe6]
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
